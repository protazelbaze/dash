server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx.
    server_tokens off;

    # --- Page statique ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Actions : relais serveur -> webhooks n8n ---
    # Le navigateur appelle /api/<nom> (même origine, protégé par Cloudflare Access).
    # nginx relaie en interne vers n8n sur le réseau docker, jamais exposé dehors.
    # Ex : POST /api/dash-ingestion  ->  http://n8n:5678/webhook/dash-ingestion
    location /api/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les traitements d'ingestion peuvent être longs : marge de temps.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check local (docker / cloudflared).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
